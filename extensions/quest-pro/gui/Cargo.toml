[package]
name = "vrft-quest-pro-gui"
version.workspace = true
edition.workspace = true
description = "Quest Pro pages for the VRFT desktop app: headset setup over adb, cameras, eyes and tongue training"

[lib]
name = "vrft_quest_pro_gui"

[dependencies]
vrft-gui-core = { workspace = true }
vrft-protocol = { workspace = true }
vrft-quest-pro-protocol = { workspace = true }
gpui-kit = { workspace = true }
anyhow = { workspace = true }
# Local dates for recording and model names.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = { workspace = true }
rust-i18n = { workspace = true }
# GPUI images are built from `image` frames; this must match GPUI's version.
image = { version = "0.25", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }
