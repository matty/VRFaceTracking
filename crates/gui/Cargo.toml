[package]
name = "vrft-gui"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "Desktop app for VRFT: dashboard, extensions such as Quest Pro support, and starting the daemon"

[[bin]]
name = "vrft_gui"
path = "src/main.rs"

[dependencies]
vrft-gui-core = { workspace = true }
vrft-protocol = { workspace = true }
# Optional extensions, each switched on by its feature. The daemon's config
# decides whether a built-in one is shown.
vrft-quest-pro-gui = { workspace = true, optional = true }
gpui-kit = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
serde_json = { workspace = true }
rust-i18n = { workspace = true }
sys-locale = { workspace = true }
# Installs and updates the app. Keep it in step with the vpk version the
# release workflow packs with.
velopack = "=1.2.161"

[features]
default = ["quest-pro"]
quest-pro = ["dep:vrft-quest-pro-gui"]

[build-dependencies]
# Embeds resources/app.ico as the executable's icon.
embed-resource = "3"
