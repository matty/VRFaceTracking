[package]
name = "vrft-tongue"
version.workspace = true
edition.workspace = true

[lib]
name = "vrft_tongue"
path = "src/lib.rs"

[dependencies]
burn = { version = "=0.21.0", default-features = false, features = ["std", "wgpu", "flex", "simd", "autodiff", "fusion", "autotune"] }
anyhow = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
vrft-quest-pro-protocol = { workspace = true }
safetensors = "0.7"
rand = "0.9"
rayon = "1"
burn-flex = { version = "=0.21.0", features = ["rayon", "simd"] }
burn-store = { version = "=0.21.0", default-features = false, features = ["std", "pytorch"] }
# universal_v2 models: NumPy heads in an .npz, pinned to their graph by SHA-256.
zip = { version = "8", default-features = false, features = ["deflate"] }
sha2 = "0.10"
# Inference on ONNX Runtime, whose library is loaded at run time (onnx::runtime).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-24"] }

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-24", "directml"] }

[features]
# Train and run on NVIDIA's CUDA rather than wgpu, for Linux GPU servers.
cuda = ["burn/cuda"]

# examples/benchmark.rs reads the process's working set.
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
