[package]
name = "vrft-daemon"
version.workspace = true
edition.workspace = true

[[bin]]
name = "vrft_d"
path = "src/main.rs"

[lib]
name = "vrft_daemon"
path = "src/lib.rs"

[dependencies]
vrft-common = { workspace = true }
vrft-api = { workspace = true }
vrft-extension = { workspace = true }
vrft-protocol = { workspace = true }
# Optional extensions, each switched on by its feature and then enabled or
# disabled at runtime in config.json.
vrft-quest-pro-daemon = { workspace = true, optional = true }
libloading = "0.9"
rosc = "0.11"
tokio = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
ureq = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
mdns-sd = "0.17"
axum = { workspace = true }
ctrlc = "3.5"
fancy-regex = "0.17"
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[features]
default = ["quest-pro"]
xtralog = []
quest-pro = ["dep:vrft-quest-pro-daemon"]
