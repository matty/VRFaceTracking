name: Rust CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always
  # No debug info: faster builds, smaller cache.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        # Keep the cache even when the run fails.
        cache-on-failure: true

    # cargo test builds everything else.
    - name: Build plugin
      run: cargo build -p vrft-vd-module

    - name: Run tests
      run: cargo test --verbose

    - name: Clippy
      # The second run checks the build without extensions.
      run: |
        cargo clippy -- -D warnings
        cargo clippy -p vrft-daemon -p vrft-gui --no-default-features -- -D warnings

    - name: Check formatting
      run: cargo fmt -- --check
