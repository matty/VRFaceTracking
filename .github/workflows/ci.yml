name: Rust CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build --verbose

    - name: Validate Plugin Structure
      shell: pwsh
      run: |
        # Ensure the cdylib plugin builds
        cargo build -p vrft-vd-module

        # Verify the unified runtime layout: plugins/ (scanned) + runtime/ (host)
        $test_dir = "test_structure"
        New-Item -ItemType Directory -Force -Path "$test_dir/plugins"
        New-Item -ItemType Directory -Force -Path "$test_dir/runtime"

        if (-not (Test-Path "$test_dir/plugins")) { throw "Missing plugins/" }
        if (-not (Test-Path "$test_dir/runtime")) { throw "Missing runtime/" }
        Write-Host "✓ Plugin structure validated."

    - name: Run tests
      run: cargo test --verbose

    - name: Clippy
      run: cargo clippy -- -D warnings

    - name: Check formatting
      run: cargo fmt -- --check
