name: Rust CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always
  # CI never debugs its builds: without debug info they compile and link
  # faster, and the cache is smaller to save and restore.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        # A cold build takes most of an hour, so keep what a failed run built.
        cache-on-failure: true

    - name: Build
      run: cargo build --verbose

    - name: Validate Plugin Structure
      shell: pwsh
      run: |
        # Ensure the cdylib plugin builds
        cargo build -p vrft-vd-module

        # Verify the unified runtime layout: plugins/ (scanned) + runtime/ (host)
        $test_dir = "test_structure"
        New-Item -ItemType Directory -Force -Path "$test_dir/plugins"
        New-Item -ItemType Directory -Force -Path "$test_dir/runtime"

        if (-not (Test-Path "$test_dir/plugins")) { throw "Missing plugins/" }
        if (-not (Test-Path "$test_dir/runtime")) { throw "Missing runtime/" }
        Write-Host "✓ Plugin structure validated."

    - name: Run tests
      run: cargo test --verbose

    - name: Clippy
      # The second run also checks that the daemon and app build with every
      # extension left out, without a full build of its own.
      run: |
        cargo clippy -- -D warnings
        cargo clippy -p vrft-daemon -p vrft-gui --no-default-features -- -D warnings

    - name: Check formatting
      run: cargo fmt -- --check
