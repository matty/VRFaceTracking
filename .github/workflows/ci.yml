name: Rust CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# A newer push cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info: faster builds, smaller cache.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        # Keep the cache even when the run fails.
        cache-on-failure: true

    # The ONNX tests run the tongue models on ONNX Runtime's CPU build.
    - name: Fetch ONNX Runtime
      shell: pwsh
      run: |
        Invoke-WebRequest https://github.com/microsoft/onnxruntime/releases/download/v1.24.4/onnxruntime-win-x64-1.24.4.zip -OutFile onnxruntime.zip
        Expand-Archive onnxruntime.zip -DestinationPath $env:RUNNER_TEMP
        "VRFT_ONNXRUNTIME=$env:RUNNER_TEMP\onnxruntime-win-x64-1.24.4\lib\onnxruntime.dll" >> $env:GITHUB_ENV

    # cargo test builds everything else.
    - name: Build plugin
      run: cargo build -p vrft-vd-module

    - name: Run tests
      run: cargo test --verbose

    - name: Clippy
      # The second run checks the build without extensions.
      run: |
        cargo clippy -- -D warnings
        cargo clippy -p vrft-daemon -p vrft-gui --no-default-features -- -D warnings

    - name: Check formatting
      run: cargo fmt -- --check
