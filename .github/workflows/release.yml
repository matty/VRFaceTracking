name: Release

# Every push to main republishes the rolling `dev` prerelease. Running this
# workflow by hand on main publishes a CalVer release, vYYYY.M.N. The headset
# app is versioned and released separately, by release-apk.yml.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & Publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The version is worked out from the release tags.
          fetch-depth: 0

      - name: Choose version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Release from main."
              exit 1
            fi
            version=$(bash .github/scripts/next-calver.sh v)
            # crates/daemon/build.rs stamps this into vrft_d.
            echo "VRFT_VERSION=$version" >> "$GITHUB_ENV"
          else
            # The same description build.rs stamps into a dev build.
            described=$(git describe --tags --match 'v[0-9]*' --always)
            case $described in
              v*) version=${described#v} ;;
              *) version=dev-$described ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Find headset app
        id: headset
        shell: bash
        run: |
          # The headset stream protocols this build reads, from quest_pro_camera.rs.
          range=$(sed -n 's/^const PROTOCOLS: RangeInclusive<u32> = \([0-9]*\)\.\.=\([0-9]*\);$/\1 \2/p' crates/daemon/src/quest_pro_camera.rs)
          read -r low high <<<"$range"
          if [ -z "$high" ]; then
            echo "::error::Couldn't find PROTOCOLS in crates/daemon/src/quest_pro_camera.rs"
            exit 1
          fi
          protocols=$low
          [ "$low" = "$high" ] || protocols="$low to $high"
          # The headset app is released less often than VRFT, so this is often
          # a release from well before this one.
          tag=$(bash .github/scripts/headset-app.sh newest "$low" "$high")
          if [ -n "$tag" ]; then
            line="Headset app: [${tag#apk-v}]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag) is the newest release that works with this build (stream protocol $protocols)."
          else
            line="No headset app release works with this build yet: it reads stream protocol $protocols."
          fi
          echo "line=$line" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Fetch headset app
        if: steps.headset.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.headset.outputs.tag }}
        run: |
          # vrft_gui's Headset page installs this on the headset.
          mkdir -p headset-app
          gh release download "$TAG" --pattern vrft-questpro-camera.apk --dir headset-app
          mv headset-app/vrft-questpro-camera.apk "headset-app/vrft-questpro-camera-${TAG#apk-v}.apk"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Release
        run: cargo build --release --target x86_64-pc-windows-msvc -p vrft-daemon -p vrft-gui

      - name: Build Plugins
        run: cargo build --release --target x86_64-pc-windows-msvc -p vrft-vd-module

      - name: Build .NET Host
        run: |
          dotnet publish dotnet/VrcftRuntime/VrcftRuntime/VrcftRuntime.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dotnet/publish

      - name: Prepare Packages
        shell: pwsh
        run: |
          $release_dir = "target/x86_64-pc-windows-msvc/release"

          function Make-Package($name, $active, $bundle_dotnet) {
            New-Item -ItemType Directory -Force -Path "$name" | Out-Null

            # vrft_gui starts the vrft_d beside it.
            Copy-Item "$release_dir/vrft_d.exe", "$release_dir/vrft_gui.exe" "$name/"
            Copy-Item "qpro_model.py", "tongue_inference.py", "tongue_runtime_check.py", "setup-quest-pro-tongue.ps1", "prepare_vrft_tongue.py", "train_vrft_tongue.py" "$name/"
            Copy-Item "docs/guide/tongue-training.md", "docs/guide/quest-pro-eye-tracking.md" "$name/"
            New-Item -ItemType Directory -Force -Path "$name/models/quest-pro" | Out-Null
            Copy-Item "models/quest-pro/qpro-independent-visual-axis-v2.json" "$name/models/quest-pro/"
            New-Item -ItemType Directory -Force -Path "$name/third_party" | Out-Null
            Copy-Item "third_party/Qpro-Enhanced-FT-LICENSE" "$name/third_party/"
            # The headset app this build works with, named with its version.
            if (Test-Path "headset-app") {
              Copy-Item "headset-app" "$name/" -Recurse
            }

            # Runtime (native vs .NET) is auto-detected from each plugin's PE header,
            # so no `runtime` field is needed.
            $config = @{
              module = @{ active = $active }
              mutator = @{ enabled = $true; smoothness = 0.0 }
              osc = @{ output_mode = "VRChat"; send_address = "127.0.0.1"; send_port = 9000 }
              max_fps = 60.0
            } | ConvertTo-Json -Depth 10
            [System.IO.File]::WriteAllText("$name/config.json", $config)

            # All plugins live in a single recursively-scanned plugins/ folder.
            New-Item -ItemType Directory -Force -Path "$name/plugins" | Out-Null
            Copy-Item "$release_dir/vd_module.dll" "$name/plugins/"

            if ($bundle_dotnet) {
              # The .NET host lives in a dedicated runtime/ dir outside plugins/.
              New-Item -ItemType Directory -Force -Path "$name/runtime" | Out-Null
              Copy-Item "dotnet/publish/VrcftRuntime.exe" "$name/runtime/"
            }

            Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          }

          Make-Package "vrft_d-x86_64-windows-std"           "vd_module.dll"                   $false
          Make-Package "vrft_d-x86_64-windows-vrcft-runtime" "VirtualDesktop.FaceTracking.dll" $true

      - name: Publish Dev Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: "Dev Build"
          prerelease: true
          make_latest: false
          body: |
            Latest build from `main`, for testing only. It reports version ${{ steps.version.outputs.version }}.

            ${{ steps.headset.outputs.line }}

            Commit: ${{ github.sha }}
          files: |
            vrft_d-x86_64-windows-std.zip
            vrft_d-x86_64-windows-vrcft-runtime.zip

      - name: Publish Release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          HEADSET_APP: ${{ steps.headset.outputs.line }}
        run: |
          {
            echo "$HEADSET_APP"
            echo
            bash .github/scripts/release-notes.sh v ':(exclude)android'
          } > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "VRFT $VERSION" \
            --notes-file notes.md --latest \
            vrft_d-x86_64-windows-std.zip vrft_d-x86_64-windows-vrcft-runtime.zip
