name: Release

# Every push to main republishes the rolling `dev` prerelease, a dev build
# versioned YYYY.M.N-dev.C. Running this workflow by hand on main publishes a
# CalVer release, vYYYY.M.N. Each carries zips and a Velopack installer: the
# installed app updates itself from the `stable` channel (releases) or the
# `dev` channel (the dev prerelease). The headset app is versioned and
# released separately, by release-apk.yml.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  # To wait for the headset app's dev build.
  actions: read

concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & Publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The version is worked out from the release tags.
          fetch-depth: 0

      - name: Choose version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Release from main."
              exit 1
            fi
            version=$(bash .github/scripts/next-calver.sh v)
            channel=stable
            title=VRFaceTracking
          else
            version=$(bash .github/scripts/next-calver.sh v dev)
            channel=dev
            title="VRFaceTracking (Dev)"
          fi
          # build-support/version.rs stamps this into vrft_d and vrft_gui.
          echo "VRFT_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Release
        run: cargo build --release --target x86_64-pc-windows-msvc -p vrft-daemon -p vrft-gui

      - name: Build Plugins
        run: cargo build --release --target x86_64-pc-windows-msvc -p vrft-vd-module

      - name: Build .NET Host
        run: |
          dotnet publish dotnet/VrcftRuntime/VrcftRuntime/VrcftRuntime.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dotnet/publish

      - name: Wait for headset app dev build
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A push that changes the headset app also rebuilds apk-dev
          # (release-apk.yml). Bundle that build rather than the one before it.
          for _ in $(seq 60); do
            status=$(gh run list --workflow release-apk.yml --commit "$GITHUB_SHA" --event push \
              --json status --jq '.[0].status // ""')
            if [ -z "$status" ] || [ "$status" = completed ]; then
              break
            fi
            sleep 20
          done

      - name: Find headset app
        id: headset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The headset stream protocols this build reads, from the Quest Pro extension's camera.rs.
          range=$(sed -n 's/^const PROTOCOLS: RangeInclusive<u32> = \([0-9]*\)\.\.=\([0-9]*\);$/\1 \2/p' extensions/quest-pro/daemon/src/camera.rs)
          read -r low high <<<"$range"
          if [ -z "$high" ]; then
            echo "::error::Couldn't find PROTOCOLS in extensions/quest-pro/daemon/src/camera.rs"
            exit 1
          fi
          protocols=$low
          [ "$low" = "$high" ] || protocols="$low to $high"
          tag= version=
          # A dev build carries the headset app's dev build, when it speaks a
          # protocol this build reads.
          if [ "$GITHUB_EVENT_NAME" = push ] &&
            git fetch --force --quiet origin 'refs/tags/apk-dev:refs/tags/apk-dev' 2>/dev/null; then
            protocol=$(bash .github/scripts/headset-app.sh protocol apk-dev)
            if [ -n "$protocol" ] && ((protocol >= low && protocol <= high)); then
              # The release title ends with the version: "Headset app dev build (2026.9.0-dev.76)".
              version=$(gh release view apk-dev --json name --jq .name 2>/dev/null | sed -n 's/.*(\(.*\))$/\1/p' || true)
              [ -n "$version" ] && tag=apk-dev
            fi
          fi
          # Otherwise the newest release that works with this build. The
          # headset app is released less often than VRFT, so this is often a
          # release from well before this one.
          if [ -z "$tag" ]; then
            tag=$(bash .github/scripts/headset-app.sh newest "$low" "$high")
            version=${tag#apk-v}
          fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag"
          if [ "$tag" = apk-dev ]; then
            line="Headset app: the [dev build $version]($url) comes with this build (stream protocol $protocols)."
          elif [ -n "$tag" ]; then
            line="Headset app: [$version]($url) is the newest release that works with this build (stream protocol $protocols)."
          else
            line="No headset app release works with this build yet: it reads stream protocol $protocols."
          fi
          echo "line=$line" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Fetch headset app
        if: steps.headset.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.headset.outputs.tag }}
          VERSION: ${{ steps.headset.outputs.version }}
        run: |
          # vrft_gui's Headset page installs this on the headset.
          mkdir -p headset-app
          gh release download "$TAG" --pattern vrft-questpro-camera.apk --dir headset-app
          mv headset-app/vrft-questpro-camera.apk "headset-app/vrft-questpro-camera-$VERSION.apk"

      - name: Prepare Packages
        shell: pwsh
        run: |
          $release_dir = "target/x86_64-pc-windows-msvc/release"

          function Make-Package($name, $active, $bundle_dotnet) {
            New-Item -ItemType Directory -Force -Path "$name" | Out-Null

            # vrft_gui starts the vrft_d beside it.
            Copy-Item "$release_dir/vrft_d.exe", "$release_dir/vrft_gui.exe" "$name/"
            Copy-Item "docs/guide/tongue-training.md", "docs/guide/quest-pro-eye-tracking.md" "$name/"
            New-Item -ItemType Directory -Force -Path "$name/models/quest-pro" | Out-Null
            Copy-Item "models/quest-pro/qpro-independent-visual-axis-v2.json" "$name/models/quest-pro/"
            New-Item -ItemType Directory -Force -Path "$name/third_party" | Out-Null
            Copy-Item "third_party/Qpro-Enhanced-FT-LICENSE" "$name/third_party/"
            # The headset app this build works with, named with its version.
            if (Test-Path "headset-app") {
              Copy-Item "headset-app" "$name/" -Recurse
            }

            # Runtime (native vs .NET) is auto-detected from each plugin's PE header,
            # so no `runtime` field is needed.
            $config = @{
              module = @{ active = $active }
              mutator = @{ enabled = $true; smoothness = 0.0 }
              osc = @{ output_mode = "VRChat"; send_address = "127.0.0.1"; send_port = 9000 }
              max_fps = 60.0
            } | ConvertTo-Json -Depth 10
            [System.IO.File]::WriteAllText("$name/config.json", $config)

            # All plugins live in a single recursively-scanned plugins/ folder.
            New-Item -ItemType Directory -Force -Path "$name/plugins" | Out-Null
            Copy-Item "$release_dir/vd_module.dll" "$name/plugins/"

            if ($bundle_dotnet) {
              # The .NET host lives in a dedicated runtime/ dir outside plugins/.
              New-Item -ItemType Directory -Force -Path "$name/runtime" | Out-Null
              Copy-Item "dotnet/publish/VrcftRuntime.exe" "$name/runtime/"
            }

            Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          }

          Make-Package "vrft_d-x86_64-windows-std"           "vd_module.dll"                   $false
          Make-Package "vrft_d-x86_64-windows-vrcft-runtime" "VirtualDesktop.FaceTracking.dll" $true

          # The installer holds the std package plus the .NET host, so VRCFT
          # modules work too.
          Copy-Item "vrft_d-x86_64-windows-std" "installer" -Recurse
          New-Item -ItemType Directory -Force -Path "installer/runtime" | Out-Null
          Copy-Item "dotnet/publish/VrcftRuntime.exe" "installer/runtime/"

      - name: Write release notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          HEADSET_APP: ${{ steps.headset.outputs.line }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            {
              echo "$HEADSET_APP"
              echo
              bash .github/scripts/release-notes.sh v ':(exclude)android'
            } > notes.md
          else
            {
              echo "Latest build from \`main\`, for testing only. It reports version $VERSION, and the installed app updates itself from each new dev build."
              echo
              echo "$HEADSET_APP"
              echo
              echo "Commit: $GITHUB_SHA"
            } > notes.md
          fi

      - name: Pack installer
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          TITLE: ${{ steps.version.outputs.title }}
        run: |
          # Keep vpk in step with the velopack crate in crates/gui/Cargo.toml.
          dotnet tool install -g vpk --version 1.2.161
          # Every update downloads the full package: the rolling dev release
          # keeps only its newest build, so there's nothing to make deltas from.
          vpk pack --packId VRFaceTracking --packVersion "$VERSION" --packDir installer \
            --mainExe vrft_gui.exe --packTitle "$TITLE" --packAuthors VRFaceTracking --runtime win-x64 \
            --icon crates/gui/resources/app.ico --channel "$CHANNEL" --delta None \
            --releaseNotes notes.md --outputDir velopack
          ls velopack

      - name: Publish Dev Release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Recreated rather than edited, so the tag moves to this commit and
          # the last build's installer packages go with it.
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev --target "$GITHUB_SHA" --title "Dev Build ($VERSION)" \
            --notes-file notes.md --prerelease --latest=false \
            vrft_d-x86_64-windows-std.zip vrft_d-x86_64-windows-vrcft-runtime.zip \
            velopack/VRFaceTracking-dev-Setup.exe velopack/VRFaceTracking-dev-Portable.zip \
            velopack/*.nupkg velopack/releases.dev.json

      - name: Publish Release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "VRFT $VERSION" \
            --notes-file notes.md --latest \
            vrft_d-x86_64-windows-std.zip vrft_d-x86_64-windows-vrcft-runtime.zip \
            velopack/VRFaceTracking-stable-Setup.exe velopack/VRFaceTracking-stable-Portable.zip \
            velopack/*.nupkg velopack/releases.stable.json
