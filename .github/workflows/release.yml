name: Dev Release

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & Publish Dev Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Release
        run: cargo build --release --target x86_64-pc-windows-msvc -p vrft-daemon

      - name: Build Plugins
        run: cargo build --release --target x86_64-pc-windows-msvc -p vrft-vd-module

      - name: Build .NET Host
        run: |
          dotnet publish dotnet/VrcftRuntime/VrcftRuntime/VrcftRuntime.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dotnet/publish

      - name: Prepare Packages
        shell: pwsh
        run: |
          $release_dir = "target/x86_64-pc-windows-msvc/release"

          function Make-Package($name, $active, $bundle_dotnet) {
            New-Item -ItemType Directory -Force -Path "$name" | Out-Null

            Copy-Item "$release_dir/vrft_d.exe" "$name/"

            # Runtime (native vs .NET) is auto-detected from each plugin's PE header,
            # so no `runtime` field is needed.
            $config = @{
              module = @{ active = $active }
              mutator = @{ enabled = $true; smoothness = 0.0 }
              osc = @{ output_mode = "VRChat"; send_address = "127.0.0.1"; send_port = 9000 }
              max_fps = 60.0
            } | ConvertTo-Json -Depth 10
            [System.IO.File]::WriteAllText("$name/config.json", $config)

            # All plugins live in a single recursively-scanned plugins/ folder.
            New-Item -ItemType Directory -Force -Path "$name/plugins" | Out-Null
            Copy-Item "$release_dir/vd_module.dll" "$name/plugins/"

            if ($bundle_dotnet) {
              # The .NET host lives in a dedicated runtime/ dir outside plugins/.
              New-Item -ItemType Directory -Force -Path "$name/runtime" | Out-Null
              Copy-Item "dotnet/publish/VrcftRuntime.exe" "$name/runtime/"
            }

            Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          }

          Make-Package "vrft_d-x86_64-windows-std"           "vd_module.dll"                   $false
          Make-Package "vrft_d-x86_64-windows-vrcft-runtime" "VirtualDesktop.FaceTracking.dll" $true

      - name: Publish Dev Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: "Dev Build"
          prerelease: true
          make_latest: false
          body: |
            Latest build from `main`. Not versioned — for testing only.

            Commit: ${{ github.sha }}
          files: |
            vrft_d-x86_64-windows-std.zip
            vrft_d-x86_64-windows-vrcft-runtime.zip
