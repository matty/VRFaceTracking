name: Dev Release

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & Publish Dev Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Release
        run: cargo build --release --target x86_64-pc-windows-msvc -p vrft_d

      - name: Build Plugins
        run: cargo build --release --target x86_64-pc-windows-msvc -p vd_module

      - name: Build .NET Host
        run: |
          dotnet publish vrft_d/dotnet/VrcftRuntime/VrcftRuntime/VrcftRuntime.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o vrft_d/dotnet/publish

      - name: Prepare Packages
        shell: pwsh
        run: |
          $release_dir = "target/x86_64-pc-windows-msvc/release"

          function Make-Package($name, $runtime, $active, $bundle_dotnet) {
            New-Item -ItemType Directory -Force -Path "$name" | Out-Null

            Copy-Item "$release_dir/vrft_d.exe" "$name/"

            $config = @{
              module = @{ runtime = $runtime; active = $active }
              mutator = @{ enabled = $true; smoothness = 0.0 }
              calibration = @{ enabled = $false; continuous = $false; blend = 1.0 }
              osc = @{ output_mode = "VRChat"; send_address = "127.0.0.1"; send_port = 9000 }
              max_fps = 60.0
            } | ConvertTo-Json -Depth 10
            [System.IO.File]::WriteAllText("$name/config.json", $config)

            New-Item -ItemType Directory -Force -Path "$name/plugins/native" | Out-Null
            Copy-Item "$release_dir/vd_module.dll" "$name/plugins/native/"

            if ($bundle_dotnet) {
              New-Item -ItemType Directory -Force -Path "$name/plugins/dotnet/host" | Out-Null
              New-Item -ItemType Directory -Force -Path "$name/plugins/dotnet/modules" | Out-Null
              Copy-Item "vrft_d/dotnet/publish/VrcftRuntime.exe" "$name/plugins/dotnet/host/"
            }

            Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          }

          Make-Package "vrft_d-x86_64-windows-std"          "Native" "vd_module.dll"                      $false
          Make-Package "vrft_d-x86_64-windows-vrcft-runtime" "Vrcft"  "VirtualDesktop.FaceTracking.dll"   $true

      - name: Publish Dev Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: "Dev Build"
          prerelease: true
          make_latest: false
          body: |
            Latest build from `main`. Not versioned — for testing only.

            Commit: ${{ github.sha }}
          files: |
            vrft_d-x86_64-windows-std.zip
            vrft_d-x86_64-windows-vrcft-runtime.zip
