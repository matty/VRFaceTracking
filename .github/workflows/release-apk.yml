name: Release Headset App

# Run by hand on main to publish the Quest Pro headset app as apk-vYYYY.M.N.
# Every push to main that changes it republishes the rolling `apk-dev`
# prerelease, a dev build versioned YYYY.M.N-dev.C and named "(Dev)" on the
# headset. Both are signed with the release key from the repository secrets,
# so either installs over the other. VRFT itself is versioned and released
# separately, by release.yml.
on:
  push:
    branches: [ "main" ]
    paths:
      - "android/questpro-camera/**"
      # The panel bundles the desktop app's fonts.
      - "crates/gui/resources/fonts/**"
      - ".github/workflows/release-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The version is worked out from the release tags.
          fetch-depth: 0

      - name: Check prerequisites
        env:
          KEYSTORE: ${{ secrets.VRFT_APK_KEYSTORE_BASE64 }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Release from main."
            exit 1
          fi
          if [ -z "$KEYSTORE" ]; then
            echo "::error::The VRFT_APK_KEYSTORE_BASE64 secret is missing. See docs/internals/releasing.md."
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Choose version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "version=$(bash .github/scripts/next-calver.sh apk-v)" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(bash .github/scripts/next-calver.sh apk-v dev)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          KEYSTORE: ${{ secrets.VRFT_APK_KEYSTORE_BASE64 }}
          VRFT_APK_KEYSTORE_PASSWORD: ${{ secrets.VRFT_APK_KEYSTORE_PASSWORD }}
          VRFT_APK_KEY_ALIAS: ${{ secrets.VRFT_APK_KEY_ALIAS }}
          VRFT_APK_KEY_PASSWORD: ${{ secrets.VRFT_APK_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          export VRFT_APK_KEYSTORE="$RUNNER_TEMP/release.jks"
          base64 --decode <<<"$KEYSTORE" > "$VRFT_APK_KEYSTORE"
          bash android/questpro-camera/gradlew -p android/questpro-camera \
            :app:assembleRelease "-PappVersion=$VERSION" --no-daemon
          rm "$VRFT_APK_KEYSTORE"
          # Only a signed build is named app-release.apk.
          cp android/questpro-camera/app/build/outputs/apk/release/app-release.apk vrft-questpro-camera.apk

      - name: Find protocol
        id: protocol
        run: |
          protocol=$(bash .github/scripts/headset-app.sh protocol)
          if [ -z "$protocol" ]; then
            echo "::error::Couldn't find PROTOCOL in GazePackets.java"
            exit 1
          fi
          echo "protocol=$protocol" >> "$GITHUB_OUTPUT"

      - name: Publish Dev Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PROTOCOL: ${{ steps.protocol.outputs.protocol }}
        run: |
          {
            echo "Latest headset app build from \`main\`, for testing only. It reports version $VERSION and speaks headset stream protocol $PROTOCOL."
            echo
            echo "Commit: $GITHUB_SHA"
          } > notes.md
          # Recreated rather than edited, so the tag moves to this commit.
          gh release delete apk-dev --cleanup-tag --yes || true
          gh release create apk-dev --target "$GITHUB_SHA" --title "Headset app dev build ($VERSION)" \
            --notes-file notes.md --prerelease --latest=false \
            vrft-questpro-camera.apk

      - name: Publish Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PROTOCOL: ${{ steps.protocol.outputs.protocol }}
        run: |
          {
            echo "Speaks headset stream protocol $PROTOCOL, and keeps working with later VRFT releases that read it. Each VRFT release names the newest headset app release it works with."
            echo
            bash .github/scripts/release-notes.sh apk-v android/questpro-camera
          } > notes.md
          # The VRFT release stays the repository's latest.
          gh release create "apk-v$VERSION" --target "$GITHUB_SHA" --title "Headset app $VERSION" \
            --notes-file notes.md --latest=false \
            vrft-questpro-camera.apk
