[workspace]
members = [
    "crates/api",
    "crates/common",
    "crates/daemon",
    "crates/udp-rcv",
    "modules/vd_module",
    "modules/test_logger",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
vrft-api = { path = "crates/api" }
vrft-common = { path = "crates/common" }
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glam = "0.31"
windows = "0.62"
